name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'mikaja-local-pass' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bubblewrap telepítése
        run: npm install -g @bubblewrap/cli@1.21.0

      - name: Aláíró kulcs
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
            echo "Állandó aláíró kulcs a titkokból."
          else
            echo "::warning::Nincs ANDROID_KEYSTORE_BASE64 titok, ideiglenes kulccsal írom alá az APK-t."
            keytool -genkeypair -v -keystore android.keystore -alias kaja -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Mi legyen a kaja, O=Csalad, C=HU"
          fi

      - name: Ikonok kiszolgálása helyben
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          curl -sf -o /dev/null http://localhost:8080/icon-512.png

      - name: Android projekt generálása
        working-directory: android
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          jq --argjson c "${{ github.run_number }}" '.appVersionCode=$c' twa-manifest.json > t.json && mv t.json twa-manifest.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: APK fordítása
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
          ls -la *.apk
          cp app-release-signed.apk ../mi-legyen-a-kaja.apk
          keytool -list -v -keystore android.keystore -alias kaja -storepass "$KS_PASS" | grep -i "SHA256:" | head -1 | tee ../fingerprint.txt

      - name: Feltöltés a kiadásba (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Mi legyen a kaja? Android app (build ${{ github.run_number }}, ${GITHUB_REF_NAME}). Az app tartalma automatikusan frissül a weboldalról, ezt az APK-t csak egyszer kell telepíteni."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --notes "$NOTES"
          else
            gh release create apk-latest --title "Android app (APK)" --notes "$NOTES" --target "${{ github.sha }}"
          fi
          gh release upload apk-latest mi-legyen-a-kaja.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: mi-legyen-a-kaja-apk
          path: |
            mi-legyen-a-kaja.apk
            fingerprint.txt
