<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi legyen a kaja?</title>
<meta name="theme-color" content="#e4472b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1d0;--panel:#fffaf0;--ink:#4a2a1c;--red:#e4472b;--amber:#f2a33a;--ok:#3fae5a;--warn:#f0b31f;--bad:#e4472b;--muted:#8a6650;--sh:rgba(74,42,28,.3);--tile:#fff1d0;--w1:#ffd79a;--w2:#ffeccb;--glow:rgba(255,255,255,.7);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a3d;--panel:#33275a;--ink:#fff1d0;--muted:#c3b3e6;--sh:rgba(0,0,0,.45);--w1:#3b2a60;--w2:#241a3d;--glow:rgba(242,163,58,.25)}}
:root[data-theme="dark"]{--bg:#241a3d;--panel:#33275a;--ink:#fff1d0;--muted:#c3b3e6;--sh:rgba(0,0,0,.45);--w1:#3b2a60;--w2:#241a3d;--glow:rgba(242,163,58,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-size:17px;line-height:1.3}
.wrap{max-width:520px;margin:0 auto;padding:64px 14px 20px}
.sign{position:relative;background:var(--red);border:7px dotted #ffd84a;border-radius:26px;padding:16px 12px 14px;text-align:center;box-shadow:0 7px 0 var(--sh);margin-top:6px}
.sign h1{font-family:"Press Start 2P",monospace;font-weight:400;font-size:17px;line-height:1.6;margin:0;color:#fff4d6;text-shadow:3px 3px 0 #8c2415}
.sign p{margin:6px 0 0;color:#ffe9b3;font-size:15px}
.check{height:18px;margin:14px 6px 4px;border-radius:9px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--panel) 0 50%) 0 0/18px 18px;opacity:.85}
.card{background:var(--panel);border-radius:24px;padding:14px;margin:14px 0;box-shadow:0 6px 0 var(--sh)}
.card h2{font-size:15px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.bar{height:20px;background:var(--bg);border-radius:12px;overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;width:68%;border-radius:12px;background:linear-gradient(#ffc866,var(--amber))}
.tabs{display:flex;gap:8px;margin-top:14px}
.tabs button{flex:1;font:inherit;font-weight:600;padding:11px 4px;border:0;border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--sh);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--amber);color:#4a2a1c}
button:focus-visible{outline:3px dashed var(--amber);outline-offset:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{background:var(--bg);border-radius:20px;padding:10px}
.tile{width:64px;height:64px;border-radius:18px;background:var(--tile);display:grid;place-items:center}
.tile svg{width:54px;height:54px}
.o{stroke:#4a2a1c;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.n{font-weight:600;margin-top:6px}.q{color:var(--muted);font-size:15px}
.hp{height:12px;border-radius:8px;background:var(--panel);margin:7px 0 3px;overflow:hidden}
.hp b{display:block;height:100%;border-radius:8px}
.ok b{background:var(--ok)}.warn b{background:var(--warn)}.bad b{background:var(--bad)}
.d{font-size:15px}.bad .d{color:var(--bad);font-weight:600}
.start{display:block;width:100%;margin:18px 0 6px;padding:12px 8px 14px;border:0;border-radius:30px;font:inherit;font-weight:600;font-size:21px;color:#fff4d6;cursor:pointer;
background:linear-gradient(#f2674b,var(--red));box-shadow:0 8px 0 #9c2a17,0 14px 18px var(--sh),inset 0 4px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 #9c2a17}
.start:active{transform:translateY(6px);box-shadow:0 2px 0 #9c2a17}
.start svg{width:110px;height:73px;display:block;margin:0 auto 2px}
.steam{display:flex;justify-content:center;gap:16px;height:18px}
.steam i{width:10px;height:10px;border-radius:50%;background:#fff4d6;opacity:0}
.go .steam i{animation:up 1s ease-out 2}.go .steam i:nth-child(2){animation-delay:.2s}.go .steam i:nth-child(3){animation-delay:.4s}
@keyframes up{0%{opacity:.9;transform:translateY(14px) scale(.6)}100%{opacity:0;transform:translateY(-10px) scale(1.3)}}
@media (prefers-reduced-motion:reduce){.go .steam i{animation:none}.start:active{transform:none}}
.say{position:relative;background:#fff4d6;color:#4a2a1c;border-radius:22px;padding:12px 14px;margin:14px 0 0;box-shadow:0 6px 0 var(--sh)}
.say::before{content:"";position:absolute;top:-12px;left:34px;border:12px solid transparent;border-top:0;border-bottom-color:#fff4d6}
.say h2{font-size:19px;color:var(--red);margin:0 0 4px;font-weight:600}
.say ul{margin:6px 0 0;padding-left:20px}.tag{color:var(--bad);font-weight:600}
.app{display:flex;gap:10px;flex-wrap:wrap}
.app button{flex:1;min-width:150px;font:inherit;font-weight:600;padding:11px 10px;border:0;border-radius:18px;background:var(--amber);color:#4a2a1c;box-shadow:0 5px 0 var(--sh);cursor:pointer}
.app button:active{transform:translateY(4px);box-shadow:none}
#st{width:100%;color:var(--muted);font-size:15px;margin:4px 2px 0}
.note{color:var(--muted);font-size:14px;text-align:center;margin-top:14px}
.add{display:block;width:100%;margin:0 0 6px;padding:12px;border:0;border-radius:18px;font:inherit;font-weight:600;font-size:18px;background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--sh);cursor:pointer}
.slot{cursor:pointer}.edit{font-size:14px;color:var(--muted);margin-top:4px}
dialog{border:0;border-radius:24px;padding:16px;width:min(92vw,420px);background:var(--panel);color:var(--ink);box-shadow:0 8px 0 var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.5)}dialog h3{margin:0;font-size:21px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:14px;border:3px solid var(--bg);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:10px;margin-top:18px}
.btns button{flex:1;font:inherit;font-weight:600;padding:11px 6px;border:0;border-radius:16px;cursor:pointer;box-shadow:0 4px 0 var(--sh)}
.save{background:var(--ok);color:#fff}.del{background:var(--bad);color:#fff}.cancel{background:var(--bg);color:var(--ink)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
background:radial-gradient(ellipse 80% 40% at 50% 0,var(--glow),transparent 70%),repeating-linear-gradient(90deg,rgba(74,42,28,.06) 0 2px,transparent 2px 58px),linear-gradient(var(--w1),var(--w2))}
.ft{position:absolute;opacity:.2}.ft svg{width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);width:100%;height:64px;z-index:-1;pointer-events:none}
.bulb{animation:tw 2.4s ease-in-out infinite}.bulb:nth-child(odd){animation-delay:1.2s}
@keyframes tw{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.bulb{animation:none}}
.cloth{height:64px;margin-top:6px;background:repeating-conic-gradient(var(--red) 0 25%,#fff4d6 0 50%) 0 0/32px 32px;border-top:6px solid var(--ink)}
.note{background:var(--panel);border-radius:14px;padding:8px 12px}
.vnav{display:flex;gap:8px;margin-top:14px}
.vnav button{flex:1;font:inherit;font-weight:600;padding:11px 4px;border:0;border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--sh);cursor:pointer}
.vnav button[aria-selected="true"]{background:var(--red);color:#fff4d6}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:2px dashed var(--bg);cursor:pointer}
.li:last-child{border-bottom:0}
.dh{font-weight:600;color:var(--muted);margin:12px 0 2px;font-size:15px}
#sug{margin:0;padding-left:20px}#sug li{margin:6px 0}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div id="ft"></div></div>
<svg class="top" viewBox="0 0 400 64" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><path d="M-10 10H410" stroke="#4a2a1c" stroke-width="3"/><polygon points="14,10 48,10 31,44" fill="#e4472b" stroke="#4a2a1c" stroke-width="2" stroke-linejoin="round"/><polygon points="62,10 96,10 79,44" fill="#f2a33a" stroke="#4a2a1c" stroke-width="2" stroke-linejoin="round"/><polygon points="110,10 144,10 127,44" fill="#2fb5a8" stroke="#4a2a1c" stroke-width="2" stroke-linejoin="round"/><polygon points="158,10 192,10 175,44" fill="#f7d44a" stroke="#4a2a1c" stroke-width="2" stroke-linejoin="round"/><polygon points="206,10 240,10 223,44" fill="#e4472b" stroke="#4a2a1c" stroke-width="2" stroke-linejoin="round"/><polygon points="254,10 288,10 271,44" fill="#f2a33a" stroke="#4a2a1c" stroke-width="2" stroke-linejoin="round"/><polygon points="302,10 336,10 319,44" fill="#2fb5a8" stroke="#4a2a1c" stroke-width="2" stroke-linejoin="round"/><polygon points="350,10 384,10 367,44" fill="#f7d44a" stroke="#4a2a1c" stroke-width="2" stroke-linejoin="round"/><circle class="bulb" cx="38" cy="16" r="5" fill="#fff3a0"/><circle class="bulb" cx="86" cy="16" r="5" fill="#fff3a0"/><circle class="bulb" cx="134" cy="16" r="5" fill="#fff3a0"/><circle class="bulb" cx="182" cy="16" r="5" fill="#fff3a0"/><circle class="bulb" cx="230" cy="16" r="5" fill="#fff3a0"/><circle class="bulb" cx="278" cy="16" r="5" fill="#fff3a0"/><circle class="bulb" cx="326" cy="16" r="5" fill="#fff3a0"/><circle class="bulb" cx="374" cy="16" r="5" fill="#fff3a0"/></svg>
<div class="wrap">
  <header class="sign"><h1>Mi legyen<br>a kaja?</h1><p>Nyitva: mindig, amíg van mit főzni</p></header>
  <div class="check" aria-hidden="true"></div>

  <div class="vnav" role="tablist" aria-label="Oldalak">
    <button role="tab" aria-selected="true" data-v="stock">Raktár</button>
    <button role="tab" aria-selected="false" data-v="cost">Költség</button>
    <button role="tab" aria-selected="false" data-v="stat">Statisztika</button>
  </div>
  <div id="v-stock">
  <section class="card" aria-label="Napi költségkeret">
    <h2>Mai keret</h2>
    <div id="bt"></div>
    <div class="bar"><b id="bb" style="width:0%"></b></div>
  </section>

  <div class="tabs" role="tablist" aria-label="Hol van az étel?">
    <button role="tab" aria-selected="true" data-t="fridge">Hűtő</button>
    <button role="tab" aria-selected="false" data-t="pantry">Spájz</button>
    <button role="tab" aria-selected="false" data-t="freezer">Fagyasztó</button>
  </div>
  <button class="add" id="add">+ Új termék</button>
  <section class="card" aria-live="polite"><div class="grid" id="grid"></div></section>

  <button class="start" id="go"><span class="steam" aria-hidden="true"><i></i><i></i><i></i></span><span id="bowl"></span>Mit főzzek ebből?</button>
  <section class="say" id="rcp" hidden></section>
  </div>
  <div id="v-cost" hidden>
    <section class="card"><h2>Költségkeret</h2><div id="bsum"></div><div class="app" style="margin-top:12px"><button id="bset">Keret beállítása</button></div></section>
    <button class="add" id="xadd">+ Új kiadás</button>
    <section class="card"><h2>Kiadások</h2><div id="xlist"></div></section>
  </div>
  <div id="v-stat" hidden>
    <section class="card"><h2>Ezen a héten</h2><div id="sw"></div></section>
    <section class="card"><h2>Javaslatok</h2><ul id="sug"></ul></section>
    <button class="add" id="madd">+ Mit ettem?</button>
    <section class="card"><h2>Étkezési napló</h2><div id="mlist"></div></section>
  </div>

  <section class="card">
    <h2>Az app</h2>
    <div class="app">
      <button id="upd">Frissítés keresése</button>
      <button id="inst">Letöltés a telefonra</button>
      <div id="st">Verzió 0.5</div>
    </div>
  </section>
  <p class="note">Minta-adatokkal készült prototípus.</p>
</div>

<div class="cloth" aria-hidden="true"></div>
<dialog id="gd"><form id="gf" onsubmit="return false"><h3 id="gt"></h3><div id="gb"></div>
<div class="btns"><button type="button" class="save" id="gs">Mentés</button><button type="button" class="del" id="gdl" hidden>Törlés</button><button type="button" class="cancel" id="gc">Mégse</button></div></form></dialog>
<datalist id="shops"><option value="Lidl"><option value="Aldi"><option value="Spar"><option value="Tesco"><option value="Penny"><option value="CBA"><option value="Coop"><option value="Piac"></datalist>
<datalist id="meals"></datalist>
<dialog id="dlg"><form id="f" onsubmit="return false">
<h3 id="dt">Új termék</h3>
<label for="fn">Név</label><input id="fn" list="cat" required autocomplete="off" placeholder="pl. Csirkemell"><datalist id="cat"></datalist>
<div class="row"><div><label for="fq">Mennyiség</label><input id="fq" type="number" step="any" min="0.01" required inputmode="decimal"></div>
<div><label for="fu">Mértékegység</label><select id="fu"><option>g</option><option>kg</option><option>ml</option><option>dl</option><option>l</option><option>db</option></select></div></div>
<div class="row"><div><label for="fl">Hol van?</label><select id="fl"><option value="fridge">Hűtő</option><option value="pantry">Spájz</option><option value="freezer">Fagyasztó</option></select></div>
<div><label for="fe">Lejárat</label><input id="fe" type="date" required></div></div>
<div class="btns"><button type="button" class="save" id="fs">Mentés</button><button type="button" class="del" id="fd" hidden>Törlés</button><button type="button" class="cancel" id="fc">Mégse</button></div>
</form></dialog>
<script>
var VER="0.5";
function svg(i,v){return '<svg viewBox="'+(v||"0 0 64 64")+'" aria-hidden="true">'+i+"</svg>"}
var S={
egg:svg('<path class="o" d="M9 31C7 18 19 10 32 12s24 8 22 21-12 21-24 20S11 43 9 31z" fill="#fff"/><circle class="o" cx="32" cy="32" r="11" fill="#f7b500"/><circle cx="28" cy="28" r="3.5" fill="#fff3b0"/>'),

cheese:svg('<path class="o" d="M6 42L36 22l22 20z" fill="#ffe27a"/><path class="o" d="M6 42h52v14H6z" fill="#ffc928"/><circle cx="16" cy="49" r="3.2" fill="#e69a00"/><circle cx="32" cy="50" r="4" fill="#e69a00"/><circle cx="48" cy="48" r="2.8" fill="#e69a00"/><circle cx="38" cy="33" r="2.5" fill="#f0b800"/>'),

};
var KEYS={f:"fridge",p:"pantry",z:"freezer"};

var st=document.getElementById("st"),upd=document.getElementById("upd"),inst=document.getElementById("inst"),REG=null,NEW=null,DEF=null;
function say(t){st.textContent=t}
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js").then(function(r){REG=r;
r.addEventListener("updatefound",function(){var w=r.installing;if(!w)return;w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller){NEW=w;upd.textContent="Frissítés telepítése";say("Új verzió letöltve, koppints a frissítésre.")}})})}).catch(function(){});
navigator.serviceWorker.addEventListener("controllerchange",function(){location.reload()})}
upd.onclick=function(){
if(NEW){NEW.postMessage("skip");return}
if(!REG){say("A frissítés a telepített appban működik. Verzió "+VER);return}
say("Keresem az új verziót...");
REG.update().then(function(){setTimeout(function(){if(!NEW)say("A legfrissebb verziót használod ("+VER+").")},1200)}).catch(function(){say("Nincs kapcsolat. Az app így is működik offline.")})};
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();DEF=e});
inst.onclick=function(){if(DEF){DEF.prompt();DEF=null}else say("Telepítés: böngésző menü, majd Hozzáadás a kezdőképernyőhöz. A Google Play verzió később érkezik.")};
window.addEventListener("offline",function(){say("Offline vagy, az app így is működik.")});
</script>
</body>
</html>
